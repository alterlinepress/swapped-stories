{% assign form_id = include.form_id | default: "next-book-vote" %}

<div class="contact-card contact-card--compact next-book-vote">
  <h2 class="contact-card__title">Vote on the Next Book</h2>

  <form
    class="contact-form contact-form--compact js-next-book-vote-form"
    action="https://formspree.io/f/mkopwode"
    method="POST"
  >
    <fieldset class="vote-group">
      <legend class="vote-group__legend"></legend>

      {% for book in site.data.next_book_choices %}
        <label class="vote-option">
          <input
            type="radio"
            name="next_book_vote"
            value="{{ book.title }} — {{ book.author }}"
            required
          >
          <span>{{ book.title }}</span>
          <small>{{ book.author }}</small>
        </label>
      {% endfor %}

      <label class="vote-option vote-option--other">
        <input
          type="radio"
          name="next_book_vote"
          value="Other"
          class="js-other-radio"
        >
        <span>Suggest another</span>
      </label>
    </fieldset>

    <div class="contact-form__field js-other-wrapper" hidden>
      <label for="{{ form_id }}-other-book">Suggested title and author</label>
      <input
        id="{{ form_id }}-other-book"
        type="text"
        name="other_book_suggestion"
        placeholder="Example: Jane Eyre — Charlotte Brontë"
        class="js-other-input"
        disabled
      >
    </div>

    <button class="contact-form__submit" type="submit">Submit vote</button>
  </form>

  <div class="contact-success js-vote-success" hidden>
    <h3>Thanks for voting.</h3>
    <p>Your submission was sent successfully.</p>
  </div>

  <div class="contact-error js-vote-error" hidden>
    <p>Something went wrong. Please try again.</p>
  </div>
</div>
